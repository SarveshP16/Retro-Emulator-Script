<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Retro Emulator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a3a"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#aeb9c4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- app-icon plate -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="111" fill="none" stroke="#58a6ff" stroke-opacity="0.22" stroke-width="6"/>

  <!-- phone body -->
  <rect x="140" y="56" width="232" height="400" rx="34" fill="url(#body)"/>
  <rect x="140" y="56" width="232" height="400" rx="34" fill="none" stroke="#5b6672" stroke-width="5"/>

